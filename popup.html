<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Hacker News</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-mark">Y</div>
        <div class="logo-text">
          <span class="logo-name">Custom Hacker News</span>
          <span class="logo-sub">Theme Selector</span>
        </div>
      </div>
    </div>

    <!-- Theme options -->
    <div class="section-label">Appearance</div>
    <div class="options" role="radiogroup" aria-label="Theme">

      <button class="option" data-theme="default" role="radio" aria-checked="false">
        <span class="option-preview preview-default">
          <span class="preview-bar"></span>
          <span class="preview-line"></span>
          <span class="preview-line short"></span>
        </span>
        <span class="option-info">
          <span class="option-name">Default</span>
          <span class="option-desc">Original Hacker News</span>
        </span>
        <span class="option-check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 7L5.5 10L11.5 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <button class="option" data-theme="dark" role="radio" aria-checked="false">
        <span class="option-preview preview-dark">
          <span class="preview-bar"></span>
          <span class="preview-line"></span>
          <span class="preview-line short"></span>
        </span>
        <span class="option-info">
          <span class="option-name">Dark</span>
          <span class="option-desc">GitHub Dark × Linear</span>
        </span>
        <span class="option-check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 7L5.5 10L11.5 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

      <button class="option" data-theme="light" role="radio" aria-checked="false">
        <span class="option-preview preview-light">
          <span class="preview-bar"></span>
          <span class="preview-line"></span>
          <span class="preview-line short"></span>
        </span>
        <span class="option-info">
          <span class="option-name">Light</span>
          <span class="option-desc">Clean & minimal</span>
        </span>
        <span class="option-check" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 7L5.5 10L11.5 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>

    </div>

    <!-- Appearance & Layout -->
    <div class="section-label">Appearance & Layout</div>
    <div class="settings">
      <div class="setting-row">
        <span>Show footer</span>
        <label class="checkbox-switch">
          <input type="checkbox" id="showFooter" />
          <span class="checkbox-ui"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>Show article numbers</span>
        <label class="checkbox-switch">
          <input type="checkbox" id="showArticleNumbers" />
          <span class="checkbox-ui"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>Show upvotes</span>
        <label class="checkbox-switch">
          <input type="checkbox" id="showUpvotes" />
          <span class="checkbox-ui"></span>
        </label>
      </div>

      <div class="setting-row">
        <span>Content width</span>
        <select id="contentWidth" class="control-select" aria-label="Content width">
          <option value="700">700px</option>
          <option value="900">900px</option>
          <option value="1200">1200px</option>
          <option value="1400">1400px</option>
        </select>
      </div>

      <div class="setting-row">
        <span>Font family</span>
        <select id="fontFamily" class="control-select" aria-label="Font family">
          <option value="system">System</option>
          <option value="Inter">Inter</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
          <option value="Fira Code">Fira Code</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Arial">Arial</option>
        </select>
      </div>

      <div class="setting-row range-row">
        <span>Font size</span>
        <div class="range-field">
          <input type="range" id="fontSize" min="10" max="24" step="1" />
          <span id="fontSizeValue">14px</span>
        </div>
      </div>

      <div class="setting-row range-row">
        <span>Article spacing</span>
        <div class="range-field">
          <input type="range" id="articleLineWidth" min="300" max="1200" step="50" />
          <span id="articleLineWidthValue">700px</span>
        </div>
      </div>

      <div class="setting-row reset-row">
          <button id="resetAppearance" class="reset-button" type="button">Reset</button>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      Changes apply instantly. Visit <a href="https://news.ycombinator.com/" target="_blank" rel="noopener noreferrer">Hacker News</a> to see them.
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
